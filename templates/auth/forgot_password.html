{% extends "base.html" %}
{% block title %}{{ t('auth.forgot_password_title') }} - Biblio{% endblock %}
{% block content %}
<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <h2>{{ t('auth.forgot_password_title') }}</h2>
  <p>{{ t('auth.forgot_password_message') }}</p>
  <label>
    {{ t('auth.email') }}
    <input type="email" name="email" value="{{ email }}" autocomplete="email" required />
  </label>
  <button class="btn" type="submit">{{ t('auth.send_reset_link') }}</button>
  <p><a href="{{ url_for('auth.login') }}">{{ t('auth.login_button') }}</a></p>
</form>
{% endblock %}
