{% extends "base.html" %}
{% block title %}{{ t('auth.reset_password_title') }} - Biblio{% endblock %}
{% block content %}
<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <h2>{{ t('auth.reset_password_title') }}</h2>
  <label>
    {{ t('auth.password') }}
    <span class="password-field">
      <input id="reset-password" type="password" name="password" autocomplete="new-password" required />
      <button
        class="password-toggle"
        type="button"
        data-password-toggle="reset-password"
        data-show-label="{{ t('auth.show_password') }}"
        data-hide-label="{{ t('auth.hide_password') }}"
        aria-label="{{ t('auth.show_password') }}"
      >
        <i class="bi bi-eye" aria-hidden="true"></i>
      </button>
    </span>
  </label>
  <label>
    {{ t('auth.confirm_password') }}
    <span class="password-field">
      <input id="reset-confirm-password" type="password" name="confirm" autocomplete="new-password" required />
      <button
        class="password-toggle"
        type="button"
        data-password-toggle="reset-confirm-password"
        data-show-label="{{ t('auth.show_password') }}"
        data-hide-label="{{ t('auth.hide_password') }}"
        aria-label="{{ t('auth.show_password') }}"
      >
        <i class="bi bi-eye" aria-hidden="true"></i>
      </button>
    </span>
  </label>
  <button class="btn" type="submit">{{ t('auth.reset_password_submit') }}</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/password-toggle.js') }}" defer></script>
{% endblock %}
